<div class="fixed inset-0 z-50 transition-all duration-700 font-sans">
  <!-- THEME: DEEP SPACE (Dark Mode Glassmorphism) with Subtle Background Glow -->
  <div class="absolute inset-0 flex items-center justify-center p-4 sm:p-6 overflow-hidden bg-[#0B0F19]">
    
    <!-- Subtle Background Ambient Images -->
    <div class="absolute inset-0 w-full h-full pointer-events-none opacity-20">
      <div *ngFor="let bg of backgroundImages; let i = index" 
           class="absolute inset-0 w-full h-full bg-cover bg-no-repeat bg-center transition-opacity duration-1000"
           [style.background-image]="'url(' + bg + ')'"
           [ngClass]="{'opacity-100': currentBgIndex === i, 'opacity-0': currentBgIndex !== i}">
      </div>
    </div>

    <!-- Soft Glow Orbs -->
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
      <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-[#377DFF]/15 rounded-full filter blur-[120px] pointer-events-none animate-pulse"></div>
      <div class="absolute bottom-10 right-1/4 w-[400px] h-[400px] bg-[#F80086]/10 rounded-full filter blur-[100px] pointer-events-none"></div>
    </div>
    
    <!-- Top-Right Close Button -->
    <button (click)="exitAdmin()" 
            class="absolute top-6 right-6 z-[60] flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 text-white/80 hover:text-white transition-all border border-white/10 backdrop-blur-md hover:scale-105 active:scale-95 group shadow-lg"
            title="Torna alla Wiki">
      <span class="text-xs font-medium text-slate-300 group-hover:text-white hidden sm:inline">Torna alla Wiki</span>
      <svg class="w-4 h-4 text-slate-300 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Centered Glassmorphic Login Card -->
    <div class="relative z-10 w-full max-w-md p-8 sm:p-10 bg-[#1E293B]/70 border border-white/10 shadow-[0_30px_70px_rgba(0,0,0,0.6)] rounded-[2.5rem] backdrop-blur-2xl text-[#F8FAFD] animate-fade-up">
      
      <!-- Top Badge -->
      <div class="flex items-center justify-center gap-2 px-3.5 py-1.5 rounded-full bg-[#377DFF]/15 border border-[#377DFF]/30 text-[#377DFF] text-[11px] font-bold tracking-wider uppercase mb-6 w-fit mx-auto shadow-sm">
        <span class="w-2 h-2 rounded-full bg-[#377DFF] animate-pulse"></span>
        Quaderno Elettronico
      </div>

      <!-- Title & Subtitle -->
      <div class="text-center mb-8">
        <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white mb-2">Area Amministrativa</h2>
        <p class="text-xs sm:text-sm text-[#94A3B8]">Inserisci le credenziali per accedere al pannello</p>
      </div>

      <!-- Form Inputs -->
      <div class="space-y-4">
        <!-- Email Input -->
        <div>
          <label class="block text-xs font-medium text-[#94A3B8] mb-1.5 ml-1">Email</label>
          <div class="relative flex items-center bg-[#0F172A]/80 border border-white/10 focus-within:border-[#377DFF] focus-within:ring-2 focus-within:ring-[#377DFF]/20 rounded-2xl transition-all px-4 py-3.5 shadow-inner">
            <div class="mr-3 text-[#377DFF] flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
            <input type="email" 
                   [(ngModel)]="loginEmail" 
                   (keyup.enter)="loginAdmin()" 
                   placeholder="admin@example.com" 
                   class="w-full bg-transparent border-none focus:outline-none text-white placeholder-[#64748B] text-sm font-normal">
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label class="block text-xs font-medium text-[#94A3B8] mb-1.5 ml-1">Password</label>
          <div class="relative flex items-center bg-[#0F172A]/80 border border-white/10 focus-within:border-[#377DFF] focus-within:ring-2 focus-within:ring-[#377DFF]/20 rounded-2xl transition-all px-4 py-3.5 shadow-inner">
            <div class="mr-3 text-[#377DFF] flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" 
                   [(ngModel)]="loginPassword" 
                   (keyup.enter)="loginAdmin()" 
                   placeholder="••••••••" 
                   class="w-full bg-transparent border-none focus:outline-none text-white placeholder-[#64748B] text-sm font-normal">
          </div>
        </div>
      </div>

      <!-- Error Alert -->
      <div *ngIf="loginError" class="mt-4 p-3.5 rounded-xl bg-[#F80086]/10 border border-[#F80086]/20 text-[#F80086] text-xs font-medium flex items-center gap-2.5">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ loginError }}</span>
      </div>

      <!-- Submit Button -->
      <div class="mt-6">
        <button [disabled]="loginLoading" 
                (click)="loginAdmin()" 
                class="w-full py-3.5 px-6 rounded-2xl font-semibold text-sm text-white bg-gradient-to-r from-[#377DFF] to-[#2563eb] hover:from-[#4385ff] hover:to-[#377DFF] shadow-[0_10px_25px_rgba(55,125,255,0.35)] hover:shadow-[0_12px_30px_rgba(55,125,255,0.45)] hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
          <span *ngIf="!loginLoading" class="flex items-center gap-2">
            Accedi
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </span>
          <span *ngIf="loginLoading" class="flex items-center gap-2">
            <svg class="w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Autenticazione in corso...
          </span>
        </button>
      </div>

      <!-- Footer Info -->
      <p class="text-center text-[11px] text-[#64748B] mt-6">Accesso protetto riservato al personale autorizzato</p>

    </div>

  </div>
</div>
