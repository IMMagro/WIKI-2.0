<!-- ===== Popup comunicazione a schermo (rende il layout libero a blocchi) ===== -->
<div *ngIf="newsService.selectedNews"
     role="dialog"
     aria-modal="true"
     aria-labelledby="news-popup-title"
     class="fixed inset-0 z-[9999] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 md:p-8"
     style="animation: fadeInPage .25s ease forwards" (click)="close()">
  <div class="relative w-full max-w-4xl max-h-[92vh] bg-white dark:bg-slate-900 border border-white/40 dark:border-slate-800 rounded-2xl sm:rounded-[2rem] shadow-2xl overflow-hidden flex flex-col animate-[scaleUp_0.3s_cubic-bezier(0.175,0.885,0.32,1.275)]"
       (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 sm:px-6 sm:py-4 border-b border-slate-100 dark:border-slate-800 shrink-0 bg-slate-50/50 dark:bg-slate-800/40">
      <div class="flex items-center gap-2 sm:gap-2.5 min-w-0">
        <span class="inline-flex items-center gap-1.5 text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-magenta bg-magenta/10 dark:bg-magenta/20 rounded-full px-2.5 py-0.5 sm:px-3 sm:py-1 shrink-0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
          Comunicazione
        </span>
        <span *ngIf="newsService.selectedNews.date" class="text-xs font-semibold text-slate-400 dark:text-slate-500 truncate">{{ newsService.selectedNews.date }}</span>
      </div>
      <button (click)="close()" aria-label="Chiudi comunicazione (Esc)" title="Chiudi (Esc)"
              class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:bg-qe-blue hover:text-white transition-all active:scale-95 cursor-pointer shrink-0">
        <svg width="18" height="18" class="sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Corpo scrollabile -->
    <div class="flex-1 min-h-0 overflow-y-auto overflow-x-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
      <!-- Layout libero a blocchi (creato dall'editor) -->
      <app-news-block-renderer *ngIf="newsService.selectedNews.blocks?.length; else plainNews"
           [blocks]="newsService.selectedNews.blocks"></app-news-block-renderer>

      <!-- Comunicazione semplice (senza blocchi) -->
      <ng-template #plainNews>
        <h2 id="news-popup-title" class="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white mb-3 sm:mb-4 leading-tight tracking-tight">{{ newsService.selectedNews.title }}</h2>
        <p class="text-slate-600 dark:text-slate-300 leading-relaxed text-sm sm:text-base whitespace-pre-wrap font-normal">{{ newsService.selectedNews.excerpt || newsService.selectedNews.description }}</p>
      </ng-template>
    </div>
  </div>
</div>
