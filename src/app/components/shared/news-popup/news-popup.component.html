<!-- ===== Popup comunicazione a schermo (rende il layout libero a blocchi) ===== -->
<div *ngIf="newsService.selectedNews"
     class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 md:p-8"
     style="animation: fadeInPage .3s ease forwards" (click)="close()">
  <div class="relative w-full max-w-4xl max-h-[92vh] bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl overflow-hidden flex flex-col animate-[scaleUp_0.35s_cubic-bezier(0.175,0.885,0.32,1.275)]"
       (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800 shrink-0">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-magenta bg-magenta/10 rounded-full px-3 py-1">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
          Comunicazione
        </span>
        <span *ngIf="newsService.selectedNews.date" class="text-xs font-semibold text-slate-400">{{ newsService.selectedNews.date }}</span>
      </div>
      <button (click)="close()" aria-label="Chiudi"
              class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:bg-qe-blue hover:text-white transition-colors">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Corpo scrollabile -->
    <div class="flex-1 min-h-0 overflow-auto p-6 md:p-8 custom-scrollbar">
      <!-- Layout libero a blocchi (creato dall'editor) -->
      <app-news-block-renderer *ngIf="newsService.selectedNews.blocks?.length; else plainNews"
           [blocks]="newsService.selectedNews.blocks"></app-news-block-renderer>

      <!-- Comunicazione semplice (senza blocchi) -->
      <ng-template #plainNews>
        <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white mb-4 leading-tight">{{ newsService.selectedNews.title }}</h2>
        <p class="text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">{{ newsService.selectedNews.excerpt || newsService.selectedNews.description }}</p>
      </ng-template>
    </div>
  </div>
</div>
